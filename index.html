<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2a52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BP Notebook">
<title>Blue Prince Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column on drafting paper, phone first. Home = current day, room search, to-do focus, your rooms. Room = floorplan card + to-dos, finds, notes, sealed hint. */
:root{
  /* Blueprint: one committed look, white lines on prussian blue drafting paper, gold for actions */
  --bg:#0d2a52; --grid:rgba(190,215,255,.07); --grid-major:rgba(190,215,255,.14); --hair:rgba(200,225,255,.22);
  --paper:rgba(6,22,48,.62); --paper-solid:#0f2d58; --ink:#eef4ff; --muted:#a9bedf; --line:rgba(190,215,255,.30);
  --accent:#e9c46a; --on-accent:#13213a; --danger:#ff8f86; --overlay:rgba(2,10,25,.72);
  --c-blue:#4b82df; --c-purple:#9a6be0; --c-orange:#e48a3c; --c-green:#47a660; --c-yellow:#e2bb3c;
  --c-red:#d9524a; --c-black:#05070c; --c-outer:#9a8664; --c-grounds:#5f9a6b; --c-under:#7c8597; --c-item:#c9a227; --c-book:#a0522d; --c-person:#c2577e; --c-general:#8d9bb3;
  --on-color:#ffffff; --on-yellow:#2a2108;
  --f-display:"Cormorant SC","Cormorant Garamond",Georgia,serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --tap:44px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:680px;margin:0 auto;padding-block:16px 72px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.02em}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:17px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}

.btn{min-height:var(--tap);border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:0 14px;cursor:pointer;
  font-family:var(--f-mono);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.room{background:var(--rc);border-color:var(--rc);color:var(--rt);font-weight:500}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:var(--paper)}
.btn.sq{width:var(--tap);padding:0;font-size:20px}
.btn.sm{min-height:36px;font-size:13px;padding:0 10px}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;flex-direction:column;text-decoration:none;color:inherit;line-height:1}
.brand h1{font-size:28px}
.brand .label{font-size:10px;margin-top:4px}
.daybox{display:flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px}
.daybox .btn{border-color:transparent;min-height:40px;width:40px}
.daynum{min-width:72px;text-align:center;border:0;background:transparent;cursor:pointer;padding:0 4px;line-height:1.1}
.daynum .label{display:block;font-size:10px}
.daynum b{font-family:var(--f-display);font-size:26px}
.daynum.unset b{font-size:15px;font-family:var(--f-mono);font-weight:500}

/* Search */
.search{display:flex;flex-direction:column;gap:8px}
.search h2{font-size:clamp(28px,7vw,40px);line-height:1.05}
.search p{margin:0;color:var(--muted);font-size:15px}
.search form{display:flex;gap:8px}
.search input{flex:1;min-width:0;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-family:var(--f-display);font-size:22px;font-weight:500}
.err{color:var(--danger);font-size:15px;margin:0}.err:empty{display:none}

/* Panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sec{display:flex;flex-direction:column;gap:10px;padding:16px}
.sec + .sec{border-top:1px solid var(--line)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec-h h3{font-size:24px}
.tools{display:flex;align-items:center;gap:4px}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:15px;margin:0}
.muted em{font-style:italic}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{flex:1;min-height:40px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab .n{font-variant-numeric:tabular-nums;font-size:12px;opacity:.8}
.tab.warn .n{color:var(--danger);opacity:1;font-weight:500}

/* Item lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.item:last-child{border-bottom:0}
.check{position:relative;width:var(--tap);height:var(--tap);flex:none;margin:-4px -6px -4px -8px;display:grid;place-items:center;cursor:pointer}
.check input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.check span{width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center}
.check input:checked + span{background:var(--rc,var(--accent));border-color:var(--rc,var(--accent))}
.check input:checked + span::after{content:"";width:6px;height:12px;border:solid var(--rt,var(--on-accent));border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.check input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rc);margin:9px 6px 0 2px;flex:none}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;cursor:pointer;padding-top:4px;border:0;background:transparent;text-align:left}
.body .t{overflow-wrap:anywhere;white-space:pre-wrap}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);text-decoration:none;line-height:1.4}
.chip.day{border-color:var(--rc,var(--accent));color:var(--ink)}
.chip.past{border-color:var(--danger);color:var(--danger)}
.chip.room{background:var(--rc);border-color:var(--rc);color:var(--rt)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.col .body{width:100%}

/* Add row */
.add{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.add input{flex:1 1 160px;min-width:0;min-height:var(--tap);padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.add .btns{display:flex;gap:6px;flex:0 0 auto}
.add-note{display:flex;flex-direction:column;gap:8px}
.add-note .btns{display:flex;justify-content:flex-end}
textarea{width:100%;min-height:88px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);line-height:1.5}

/* Edit form */
.edit{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--rc,var(--accent));border-radius:8px;background:var(--bg);margin:4px 0}
.edit input[type=text]{width:100%;min-height:var(--tap);padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.edit textarea{background:var(--paper)}
.edit .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.edit .acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.edit .acts div{display:flex;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{min-height:40px;border:0;background:transparent;padding:0 12px;font-family:var(--f-mono);font-size:13px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked="true"]{background:var(--rc,var(--accent));color:var(--rt,var(--on-accent))}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper input{width:64px;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--paper);text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stepper .btn{min-height:40px;width:40px}

/* Visited rooms */
.rooms{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;background:var(--paper);text-decoration:none;color:inherit;overflow:hidden;min-height:60px}
.tile:hover{border-color:var(--accent)}
.tile .sw{width:8px;flex:none;background:var(--rc)}
.tile .tx{padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .nm{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1}
.tile .mt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--muted);font-size:15px}

/* Room card */
.card-head{background:var(--rc);color:var(--rt);padding:16px;display:flex;flex-direction:column;gap:4px;position:relative}
.card-head::after{content:"";position:absolute;inset:7px;border:1px solid currentColor;opacity:.35;border-radius:5px;pointer-events:none}
.card-head .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-head .num{font-family:var(--f-mono);font-size:13px;letter-spacing:.12em}
.card-head .kind{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.card-head h2{font-size:clamp(36px,10vw,52px);line-height:1}
.aq{background:linear-gradient(90deg,var(--c-blue),var(--c-purple),var(--c-orange),var(--c-green),var(--c-yellow),var(--c-red))}
.note-stamp{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.hint{display:flex;flex-direction:column;gap:10px}
.seal{display:flex;align-items:center;gap:12px}
.lock{width:44px;height:44px;border-radius:50%;background:var(--rc);color:var(--rt);display:grid;place-items:center;flex:none}
.seal p{margin:0;flex:1;color:var(--muted);font-size:15px}
.hint .text{margin:0;font-size:17px}
.src{font-size:13px;color:var(--muted);margin:0}
.backrow{display:flex;justify-content:space-between;align-items:center}
.foot{display:flex;justify-content:center}

/* Modal */
.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:16px max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:560px){.ov{align-items:center}}
.modal{background:var(--paper);border:1px solid var(--line);border-radius:14px;max-width:420px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h3{font-size:26px}
.modal p{margin:0;color:var(--muted)}
.modal .acts{display:flex;gap:8px}
.modal .acts .btn{flex:1}
.bigday{display:flex;align-items:center;justify-content:center;gap:10px}
.bigday .btn{width:56px;min-height:56px;font-size:26px}
.bigday input{width:110px;min-height:64px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.quickdays{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.quickdays .btn{min-height:36px;font-size:13px}

@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:380px){.add .btns .btn{padding:0 10px}}

/* ---- v3: pages, filters, compact rows ---- */
#view{display:flex;flex-direction:column;gap:16px}
.item{gap:6px;padding:0;align-items:center}
.item.editing{display:block}
.check{width:40px;height:40px;margin:0 -4px 0 -8px}
.check span{width:22px;height:22px}
.dot{margin:0 6px 0 4px}
.body{flex-direction:row;align-items:center;gap:8px;padding:6px 0;min-height:40px}
.body .t{flex:1;min-width:0;font-size:16px;line-height:1.35}
.inline-acts{display:flex;gap:4px;flex:none}
.btn.xs{min-height:32px;padding:0 8px;font-size:12px}
.groups{display:flex;flex-direction:column;gap:12px}
.g-head{display:flex;align-items:center;gap:8px;text-decoration:none;padding:4px 0 6px;border-bottom:2px solid var(--rc)}
.g-head .sw{width:10px;height:10px;border-radius:3px;background:var(--rc);flex:none}
.g-name{font-family:var(--f-display);font-weight:700;font-size:19px;flex:1;min-width:0}
.g-n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.g-go{color:var(--muted);font-size:20px;line-height:1}
.search h2{font-size:clamp(26px,6.5vw,36px)}
.hint-line{font-size:13px!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;text-decoration:none;min-width:0}
.stat:hover{border-color:var(--accent)}
.stat .label{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat .s-sub{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.stat.warn b{color:var(--danger)}
.more{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-decoration:none;align-self:flex-start}
.page-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.page-h .btn{margin-left:-14px}
.page-h h2{font-size:32px;flex:1}
a.tab{text-decoration:none}
.tab[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toolbar,.filters{display:flex;flex-direction:column;gap:8px}
.tools.end{justify-content:flex-end;gap:8px}
input[type=search]{width:100%;min-height:var(--tap);padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;min-height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--paper);font-family:var(--f-mono);font-size:12px;cursor:pointer;white-space:nowrap}
.cat .sw{width:10px;height:10px;border-radius:50%;background:var(--rc)}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bulk{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rlist{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rlist li + li{border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.rrow{display:flex;align-items:center;gap:10px;padding:0 12px;min-height:48px;text-decoration:none}
.rrow:hover{background:var(--bg)}
.rrow .sw{width:8px;height:26px;border-radius:3px;background:var(--rc);flex:none}
.rrow .nm{font-family:var(--f-display);font-weight:700;font-size:19px;flex:1;min-width:0}
.rrow .no{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rrow .open{font-family:var(--f-mono);font-size:12px;min-width:26px;height:22px;padding:0 6px;border-radius:99px;background:var(--rc);color:var(--rt);display:grid;place-items:center}
.rrow .open.zero{background:transparent;color:var(--muted)}

/* ---- v4: blueprint look ---- */
body{background-color:var(--bg);background-image:
  linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
  linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-position:-1px -1px}
.brand{gap:2px}
.brand h1{font-size:30px;letter-spacing:.05em;order:2}
.brand .label{font-size:9px;margin:0;order:1;letter-spacing:.2em}
.panel,.rlist,.stat{position:relative;background:var(--paper);border-color:var(--line);backdrop-filter:blur(2px)}
.panel::before,.stat::before{content:"";position:absolute;inset:4px;border:1px dashed var(--hair);border-radius:7px;pointer-events:none}
.sec-h{position:relative;padding-bottom:9px}
.sec-h::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;pointer-events:none;
  background:linear-gradient(var(--hair),var(--hair)) center/100% 1px no-repeat,linear-gradient(var(--hair),var(--hair)) left/1px 100% no-repeat,linear-gradient(var(--hair),var(--hair)) right/1px 100% no-repeat}
.search > .sec-h::after{display:none}
.search h2,.page-h h2{letter-spacing:.03em}
.daybox{background:var(--paper-solid);border:1px solid var(--accent);border-radius:8px;box-shadow:inset 0 0 0 3px var(--paper-solid),inset 0 0 0 4px rgba(233,196,106,.35)}
.daynum b{color:var(--accent)}
.daynum .label{color:var(--accent);opacity:.8}
.stat b{color:var(--ink)}
.stat .label{color:var(--accent)}
.stat.warn b{color:var(--danger)}
.btn.primary{box-shadow:0 1px 0 rgba(0,0,0,.25)}
.search input,input[type=search],.add input,textarea{background:rgba(255,255,255,.05);border-color:var(--line)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
.modal{background:var(--paper-solid);border-color:var(--line);position:relative}
.modal::before{content:"";position:absolute;inset:5px;border:1px dashed var(--hair);border-radius:10px;pointer-events:none}
.edit{background:rgba(255,255,255,.04)}
.edit input[type=text],.edit textarea,.stepper input,.bigday input{background:rgba(255,255,255,.06)}
.tabs{background:rgba(0,0,0,.18)}
.tab[aria-current="page"]{background:var(--paper-solid);box-shadow:inset 0 -2px 0 var(--accent)}
.cat{background:var(--paper)}
.cat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card-head{min-height:120px;justify-content:flex-end}
.card-head h2{padding-right:76px}
.card-head .row{justify-content:flex-start;gap:12px}
.card-head .plan{position:absolute;right:18px;bottom:16px;width:60px;height:60px;opacity:.95}
.rrow .mini{width:26px;height:26px;flex:none;color:var(--rc)}
.rrow .mini svg{display:block}
.empty{border-color:var(--line);background:rgba(0,0,0,.12)}
.chip{border-color:var(--line)}
.g-head{border-bottom-width:1px}
.g-head .sw{width:16px;height:16px;border-radius:0;background:none;border:1.5px solid var(--rc)}
.foot .btn{opacity:.85}

    return open+'<path d="M14 6h22l12 12v36H14z"/><path d="M36 6v12h12"/><path d="M21 30h20M21 38h20M21 46h12" stroke-width="'+(size<40?3:1.5)+'"/></svg>';
  }
  if(CAT[r.cat].place){
    // Contour lines, like a site plan, for places outside the house or underground
    const dash = r.cat==="under" ? ' stroke-dasharray="4 3"' : "";
    return `<svg viewBox="0 0 60 60" width="${size}" height="${size}" fill="none" stroke="currentColor" aria-hidden="true"><path d="M30 6C45 6 55 16 54 30S44 55 29 54 6 44 6 30 15 6 30 6z" stroke-width="${size<40?4:2.5}"${dash}/>${size<40?"":'<path d="M30 16C40 16 45 23 44 31S37 45 29 44 16 38 16 30 21 16 30 16z" stroke-width="1" opacity=".7"/><circle cx="30" cy="30" r="5" stroke-width="1" opacity=".6"/>'}</svg>`;
  }
  const doors = DOORS[SHAPE[r.name]||"d"];
  const a=6,b=54,m=30,g=7;
  const side=(i,x1,y1,x2,y2)=>{
    if(!doors.includes(i)) return `M${x1} ${y1}L${x2} ${y2}`;
    return x1===x2 ? `M${x1} ${y1}L${x1} ${m-g}M${x1} ${m+g}L${x2} ${y2}` : `M${x1} ${y1}L${m-g} ${y1}M${m+g} ${y1}L${x2} ${y2}`;
  };
  const walls=side(0,a,a,b,a)+side(1,b,a,b,b)+side(2,a,b,b,b)+side(3,a,a,a,b);
  const swing={0:`M${m-g} ${a}L${m-g} ${a+2*g}A${2*g} ${2*g} 0 0 0 ${m+g} ${a}`,1:`M${b} ${m-g}L${b-2*g} ${m-g}A${2*g} ${2*g} 0 0 0 ${b} ${m+g}`,
    2:`M${m+g} ${b}L${m+g} ${b-2*g}A${2*g} ${2*g} 0 0 0 ${m-g} ${b}`,3:`M${a} ${m+g}L${a+2*g} ${m+g}A${2*g} ${2*g} 0 0 0 ${a} ${m-g}`};
  const arcs=doors.map(i=>swing[i]).join("");
  return `<svg viewBox="0 0 60 60" width="${size}" height="${size}" fill="none" stroke="currentColor" aria-hidden="true"><path d="${walls}" stroke-width="${size<40?4:3}" stroke-linecap="square"/>${size<40?"":`<path d="${arcs}" stroke-width="1" opacity=".7"/><path d="M14 14h32v32h-32z" stroke-width=".75" stroke-dasharray="2 3" opacity=".45"/>`}</svg>`;
}

// ---------- Modals ----------
const ov = document.getElementById("ov"), modal = document.getElementById("modal");
let modalResolve = null, lastFocus = null;
function openModal(build){
  return new Promise(res=>{
    lastFocus = document.activeElement;
    modalResolve = res;
    modal.replaceChildren(...build(v=>closeModal(v)));
    ov.hidden = false;
    const f = modal.querySelector("[data-autofocus]") || modal.querySelector("button");
    if(f) f.focus();
  });
}
function closeModal(v){
  if(ov.hidden) return;
  ov.hidden = true;
  const r = modalResolve; modalResolve = null;
  if(lastFocus && lastFocus.isConnected) lastFocus.focus();
  if(r) r(v);
}
ov.addEventListener("click",e=>{ if(e.target===ov) closeModal(null) });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !ov.hidden) closeModal(null) });

function confirmBox({title, body, ok, danger}){
  return openModal(done=>[
    el("h3",{text:title}), el("p",{text:body}),
    el("div",{class:"acts"},
      el("button",{class:"btn",type:"button",text:"Cancel","data-autofocus":true,onclick:()=>done(false)}),
      el("button",{class:"btn "+(danger?"danger solid":"primary"),type:"button",text:ok,onclick:()=>done(true)}))
  ]).then(v=>!!v);
}
// Ask which day it is. Resolves the day number, or null when cancelled.
function pickDay({title="What day is it?", body="Enter the day number shown in the game.", ok="Set day"}={}){
  const start = P.currentDay || maxDay();
  return openModal(done=>{
    const inp = el("input",{type:"number",inputmode:"numeric",min:"1",value:String(start),"aria-label":"Day number","data-autofocus":true});
    const set = v => inp.value = String(Math.max(1,v));
    const cur = () => Math.max(1,parseInt(inp.value,10)||1);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); done(cur()) } });
    const quick = el("div",{class:"quickdays"});
    const m = maxDay();
    [...new Set([m, m+1, m+2].filter(d=>d>=1))].forEach(d=>quick.append(el("button",{class:"btn sm",type:"button",text:`Day ${d}`,onclick:()=>set(d)})));
    return [el("h3",{text:title}), el("p",{text:body}),
      el("div",{class:"bigday"},
        el("button",{class:"btn",type:"button","aria-label":"Previous day",text:"−",onclick:()=>set(cur()-1)}),
        inp,
        el("button",{class:"btn",type:"button","aria-label":"Next day",text:"+",onclick:()=>set(cur()+1)})),
      quick,
      el("div",{class:"acts"},
        el("button",{class:"btn",type:"button",text:"Cancel",onclick:()=>done(null)}),
        el("button",{class:"btn primary",type:"button",text:ok,onclick:()=>done(cur())}))];
  });
}
async function ensureDay(){
  if(P.currentDay) return P.currentDay;
  const d = await pickDay({body:"Items for today are stamped with the current day. You only need to set it once per day."});
  if(d){ P.currentDay = d; P.latestDay = d; save(); renderDay() }
  return d;
}

// ---------- Current day (header) ----------
function renderDay(){
  // When browsing earlier days, offer a way back to the latest known day
  const back = document.getElementById("dayback");
  const latest = Math.max(P.latestDay||0, P.currentDay||0);
  back.hidden = !(P.currentDay && P.currentDay < latest);
  back.replaceChildren(...(back.hidden ? [] : [
    el("span",{text:`Looking at day ${P.currentDay}`}),
    el("button",{class:"btn primary sm",type:"button",text:`Back to today (day ${latest})`,onclick:()=>{ P.currentDay=latest; save(); render() }})]));
  const box = document.getElementById("daybox");
  const has = !!P.currentDay;
  box.replaceChildren(
    el("button",{class:"btn",type:"button","aria-label":"Previous day",text:"−",disabled:!has||P.currentDay<=1,onclick:()=>{ P.currentDay=Math.max(1,P.currentDay-1); save(); render() }}),
    el("button",{class:"daynum"+(has?"":" unset"),type:"button","aria-label":"Set current day",onclick:async()=>{
      const d = await pickDay(); if(d){ P.currentDay=d; P.latestDay=d; save(); render() } }},
      el("span",{class:"label",text:"Day"}), el("b",{text:has?String(P.currentDay):"Set"})),
    el("button",{class:"btn",type:"button","aria-label":"Next day",text:"+",onclick:async()=>{
      if(!P.currentDay){ const d = await pickDay(); if(d){ P.currentDay=d; P.latestDay=d; save(); render() } return }
      P.currentDay++; P.latestDay=Math.max(P.latestDay||0,P.currentDay); save(); render() }}));
}

// ---------- Items (to-dos and finds) ----------
const LABEL = {todos:"Always", found:"Always there"};
let editing = null; // "slug|key|id"

function itemRow(slug, key, it, {onChange, pastActions=true, hideDay=false}){
  const r = BY_SLUG[slug], s = room(slug);
  const isTodo = key==="todos";
  const li = el("li",{class:"item"+(it.done?" done":""),style:roomVars(r)});
  if(editing === `${slug}|${key}|${it.id}`){ li.classList.add("editing"); li.append(editForm(slug,key,it,onChange)); return li }
  if(isTodo){
    li.append(el("label",{class:"check"},
      el("input",{type:"checkbox",checked:!!it.done,"aria-label":`Done: ${it.text}`,onchange:e=>{ it.done=e.target.checked; save(); onChange() }}),
      el("span",{"aria-hidden":"true"})));
  } else li.append(el("span",{class:"dot","aria-hidden":"true"}));
  const past = isPast(it);
  li.append(el("button",{class:"body",type:"button","aria-label":`Edit: ${it.text}`,onclick:()=>{ editing=`${slug}|${key}|${it.id}`; onChange() }},
    el("span",{class:"t",text:it.text}),
    it.scope==="today" && !hideDay ? el("span",{class:"chip day"+(past?" past":""),title:past?"From an earlier day":null,text:`Day ${it.day}`}) : null));
  if(pastActions && past && !it.done){
    li.append(el("span",{class:"inline-acts"},
      el("button",{class:"btn xs",type:"button",title:"Make always","aria-label":`Make always: ${it.text}`,text:"Always",onclick:()=>{ it.scope="always"; it.day=null; save(); onChange() }}),
      el("button",{class:"btn xs danger",type:"button","aria-label":`Delete: ${it.text}`,text:"✕",onclick:()=>{ s[key]=s[key].filter(x=>x.id!==it.id); save(); onChange() }})));
  }
  return li;
}

function editForm(slug, key, it, onChange){
  const s = room(slug);
  let scope = it.scope||"always";
  const text = el("input",{type:"text",value:it.text,"aria-label":"Text","data-edit":"1"});
  const dayIn = el("input",{type:"number",inputmode:"numeric",min:"1",value:String(it.day||P.currentDay||maxDay()),"aria-label":"Day"});
  const step = d => dayIn.value = String(Math.max(1,(parseInt(dayIn.value,10)||1)+d));
  const stepper = el("span",{class:"stepper"},
    el("button",{class:"btn",type:"button","aria-label":"Day down",text:"−",onclick:()=>step(-1)}), dayIn,
    el("button",{class:"btn",type:"button","aria-label":"Day up",text:"+",onclick:()=>step(1)}));
  stepper.hidden = scope!=="today";
  const seg = el("span",{class:"seg",role:"radiogroup","aria-label":"When"});
  [["always",LABEL[key]],["today","One day"]].forEach(([v,l])=>{
    const b = el("button",{type:"button",role:"radio","aria-checked":String(scope===v),text:l,onclick:()=>{
      scope=v; seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-checked",String(x===b))); stepper.hidden = v!=="today" }});
    seg.append(b);
  });
  const close = () => { editing=null; onChange() };
  const form = el("form",{class:"edit",onsubmit:e=>{
    e.preventDefault();
    const t = text.value.trim(); if(!t){ text.focus(); return }
    it.text=t; it.scope=scope; it.day = scope==="today" ? Math.max(1,parseInt(dayIn.value,10)||1) : null;
    save(); close();
  }},
    text, el("div",{class:"row"},seg,stepper),
    el("div",{class:"acts"},
      el("button",{class:"btn ghost danger",type:"button",text:"Delete",onclick:()=>{ s[key]=s[key].filter(x=>x.id!==it.id); save(); close() }}),
      el("div",{},el("button",{class:"btn",type:"button",text:"Cancel",onclick:close}),
        el("button",{class:"btn primary",type:"submit",text:"Save"}))));
  form.addEventListener("keydown",e=>{ if(e.key==="Escape"){ e.stopPropagation(); close() } });
  return form;
}

function addRow(slug, key, placeholder, onChange){
  const s = room(slug);
  const inp = el("input",{type:"text",id:`add-${key}`,placeholder,"aria-label":placeholder,enterkeyhint:"done"});
  const add = async scope => {
    const t = inp.value.trim(); if(!t){ inp.focus(); return }
    let day = null;
    if(scope==="today"){ day = await ensureDay(); if(!day) return }
    s[key].push({id:uid(),text:t,done:false,scope,day,created:Date.now()});
    save(); onChange();
    const again = document.getElementById(`add-${key}`); if(again) again.focus();
  };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); add("always") } });
  return el("div",{class:"add"}, inp,
    el("div",{class:"btns"},
      el("button",{class:"btn",type:"button",text:"Always +",title:"Add, stays relevant",onclick:()=>add("always")}),
      el("button",{class:"btn room",type:"button",text:P.currentDay?`Day ${P.currentDay} +`:"Today +",title:"Add for today only",onclick:()=>add("today")})));
}

const sortTodos = list => [...list.filter(t=>!t.done), ...list.filter(t=>t.done)];
function hideToggle(doneCount, onChange){
  if(!doneCount) return null;
  return el("button",{class:"btn ghost sm",type:"button","aria-pressed":String(!!P.hideDone),
    text:P.hideDone?`Show done (${doneCount})`:"Hide done",onclick:()=>{ P.hideDone=!P.hideDone; save(); onChange() }});
}

// ---------- Shared: to-do groups, filters ----------
function todoGroups(){
  const all = [];
  Object.entries(data.rooms).forEach(([slug,s])=>{ if(BY_SLUG[slug]) (s.todos||[]).forEach(it=>all.push({slug,it})) });
  return {
    today: all.filter(x=>x.it.scope==="today" && P.currentDay && x.it.day===P.currentDay),
    always: all.filter(x=>(x.it.scope||"always")==="always"),
    past: all.filter(x=>isPast(x.it) && !x.it.done)
  };
}
const openN = g => g.filter(x=>!x.it.done).length;

const FILTER = {q:"", cat:"all"};
function matches(r, text){
  if(FILTER.cat!=="all" && r.cat!==FILTER.cat) return false;
  const q = FILTER.q.trim().toLowerCase();
  if(!q) return true;
  return r.name.toLowerCase().includes(q) || (text||"").toLowerCase().includes(q);
}
function filterBar(placeholder, cats){
  const q = el("input",{type:"search",id:"filter-q",value:FILTER.q,placeholder,"aria-label":placeholder,autocomplete:"off",enterkeyhint:"search"});
  q.addEventListener("input",()=>{ FILTER.q = q.value; render(); const n=document.getElementById("filter-q"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length) } });
  const chips = el("div",{class:"cats",role:"group","aria-label":"Filter by colour"});
  const mk = (k,label,vars) => chips.append(el("button",{type:"button",class:"cat",style:vars,"aria-pressed":String(FILTER.cat===k),onclick:()=>{ FILTER.cat = FILTER.cat===k&&k!=="all"?"all":k; render() }},
    k==="all"?null:el("span",{class:"sw","aria-hidden":"true"}), label));
  mk("all","All","");
  Object.keys(CAT).filter(k=>cats.has(k)).forEach(k=>mk(k,CAT[k].label,`--rc:var(${CAT[k].c})`));
  return el("div",{class:"filters"},q,cats.size>1?chips:null);
}

// Entries grouped under a compact room header
function groupedList(entries, onChange, opts={}){
  const by = new Map();
  entries.forEach(e=>{ if(!by.has(e.slug)) by.set(e.slug,[]); by.get(e.slug).push(e.it) });
  const wrap = el("div",{class:"groups"});
  [...by.keys()].sort((a,b)=>BY_SLUG[a].name.localeCompare(BY_SLUG[b].name)).forEach(slug=>{
    const r = BY_SLUG[slug], items = sortTodos(by.get(slug));
    wrap.append(el("section",{class:"group",style:roomVars(r)},
      el("a",{class:"g-head",href:"#"+slug},el("span",{class:"sw"+(slug==="aquarium"?" aq":""),"aria-hidden":"true"}),
        el("span",{class:"g-name",text:r.name}),el("span",{class:"g-n",text:String(items.filter(i=>!i.done).length)}),el("span",{class:"g-go","aria-hidden":"true",text:"›"})),
      el("ul",{class:"list"},items.map(it=>itemRow(slug,"todos",it,{onChange,...opts})))));
  });
  return wrap;
}

// ---------- Home ----------
function renderHome(){
  view.replaceChildren();
  // Room search
  const err = el("p",{class:"err",role:"status"});
  const input = el("input",{type:"text",placeholder:"e.g. Parlor",autocomplete:"off",autocapitalize:"words",spellcheck:"false","aria-label":"Name to open",enterkeyhint:"go"});
  view.append(el("section",{class:"search"},
    el("h2",{text:"What are you looking for?"}),
    el("form",{onsubmit:async e=>{
      e.preventDefault();
      const title = input.value.trim(), q = norm(title);
      if(!q){ err.textContent="Type a name first."; return }
      // Titles shared by several editions: ask which one
      const editions = ROOMS.filter(x=>norm(x.name.replace(/\s*\([^)]*\)\s*$/,""))===q && x.name!==title);
      if(!BY_NORM[q] && editions.length>1){
        const pickEd = await openModal(done=>[el("h3",{text:"Which edition?"}),el("p",{text:`There is more than one "${title}". Pick the one you have.`}),
          el("div",{class:"acts col"},...editions.map(x=>el("button",{class:"btn",type:"button",text:x.name,onclick:()=>done(x)})),
            el("button",{class:"btn ghost",type:"button",text:"Cancel",onclick:()=>done(null)}))]);
        if(pickEd) location.hash = pickEd.slug;
        return;
      }
      const r = BY_NORM[q];
      if(r){ location.hash = r.slug; return }
      err.textContent = "";
      const ok = await confirmBox({title:"No match found",
        body:`"${title}" is not a room, place, item, book or person the notebook knows. Check the spelling as shown in the game, or make your own General page with this title.`,
        ok:"Create General page"});
      if(ok) location.hash = createCustom(title).slug;
    }}, input, el("button",{class:"btn primary",type:"submit",text:"Open"})),
    el("p",{class:"hint-line",text:"Exact name of a room, place, item, book or person, as shown in the game. No list, so no spoilers. Anything else can become your own page."}), err));

  // Overview tiles
  const g = todoGroups();
  const tile = (href,label,n,cls="") => el("a",{class:"stat "+cls,href},el("span",{class:"label",text:label}),el("b",{text:String(n)}),el("span",{class:"s-sub",text:"open to-dos"}));
  view.append(el("nav",{class:"stats","aria-label":"To-do overview"},
    tile("#todos","Today",P.currentDay?openN(g.today):"–"),
    tile("#todos-always","Always",openN(g.always)),
    tile("#todos-past","Past days",g.past.length,g.past.length?"warn":"")));

  // Today preview
  const panel = el("section",{class:"panel"});
  const sec = el("div",{class:"sec"});
  sec.append(el("div",{class:"sec-h"},el("h3",{text:"Today"}),el("a",{class:"btn ghost sm",href:"#todos",text:"All to-dos ›"})));
  if(!P.currentDay){
    sec.append(el("p",{class:"muted",text:"Set the current day to see what you planned for today."}),
      el("button",{class:"btn primary",type:"button",text:"Set current day",onclick:async()=>{ if(await ensureDay()) render() }}));
  } else {
    const open = g.today.filter(x=>!x.it.done);
    if(!open.length) sec.append(el("p",{class:"muted",text:`Nothing open for day ${P.currentDay}. Add one in a room with the Day + button.`}));
    else {
      sec.append(groupedList(open.slice(0,8), render, {hideDay:true}));
      if(open.length>8) sec.append(el("a",{class:"more",href:"#todos",text:`${open.length-8} more for today ›`}));
    }
  }
  panel.append(sec);
  view.append(panel);

  // Overview per type
  const visitedAll = visitedRooms();
  const type = TYPES.some(([k])=>k===P.homeType) ? P.homeType : "house";
  const visited = visitedAll.filter(r=>typeOf(r)===type);
  const rs = el("section",{class:"search"});
  rs.append(el("div",{class:"sec-h"},el("h3",{text:"Your notebook"}),visited.length?el("a",{class:"btn ghost sm",href:"#rooms",onclick:()=>{ P.listType=type; save() },text:`All ${visited.length} ›`}):null));
  rs.append(typeTabs(type, k=>{ P.homeType=k; save(); render() }, visitedAll));
  if(!visited.length) rs.append(el("div",{class:"empty",text:EMPTY_TYPE[type]}));
  else rs.append(roomList(visited.slice(0,6)));
  view.append(rs);
}

// ---------- To-dos page ----------
const TODO_TABS = [["today","todos"],["always","todos-always"],["past","todos-past"]];
function renderTodos(tab){
  view.replaceChildren();
  const g = todoGroups();
  view.append(el("div",{class:"page-h"},el("a",{class:"btn ghost",href:"#",text:"← Home"}),el("h2",{text:"To-dos"})));
  const tabs = el("nav",{class:"tabs","aria-label":"To-do lists"});
  TODO_TABS.forEach(([k,h])=>{
    const label = k==="today" ? "Today" : k==="always" ? "Always" : "Past days";
    const n = k==="past" ? g.past.length : openN(g[k]);
    tabs.append(el("a",{class:"tab"+(k==="past"&&n?" warn":""),href:"#"+h,"aria-current":tab===k?"page":null},label,el("span",{class:"n",text:String(n)})));
  });
  view.append(tabs);

  if(tab==="today" && !P.currentDay){
    view.append(el("div",{class:"panel"},el("div",{class:"sec"},
      el("p",{class:"muted",text:"Set the current day to see what you planned for today."}),
      el("button",{class:"btn primary",type:"button",text:"Set current day",onclick:async()=>{ if(await ensureDay()) render() }}))));
    return;
  }
  const source = g[tab];
  const cats = new Set(source.map(x=>BY_SLUG[x.slug].cat));
  const doneN = tab==="past" ? 0 : source.filter(x=>x.it.done && matches(BY_SLUG[x.slug],x.it.text)).length;
  view.append(el("div",{class:"toolbar"},filterBar("Search to-dos or rooms",cats),
    tab!=="past" ? el("div",{class:"tools end"},hideToggle(doneN,render)) : null));

  let list = source.filter(x=>matches(BY_SLUG[x.slug],x.it.text));
  if(P.hideDone && tab!=="past") list = list.filter(x=>!x.it.done);

  const panel = el("section",{class:"panel"});
  const sec = el("div",{class:"sec"});
  if(tab==="past" && list.length){
    sec.append(el("div",{class:"bulk"},
      el("span",{class:"muted",text:`${list.length} left over from earlier days`}),
      el("span",{class:"tools"},
        el("button",{class:"btn sm",type:"button",text:"Make all always",onclick:async()=>{
          if(!await confirmBox({title:"Make all always?",body:`${list.length} to-do${list.length>1?"s":""} will no longer be tied to a day.`,ok:"Make always"})) return;
          list.forEach(({it})=>{ it.scope="always"; it.day=null }); save(); render() }}),
        el("button",{class:"btn sm danger",type:"button",text:"Delete all",onclick:async()=>{
          if(!await confirmBox({title:"Delete all past to-dos?",body:`This removes ${list.length} to-do${list.length>1?"s":""} from earlier days. This cannot be undone.`,ok:"Delete all",danger:true})) return;
          list.forEach(({slug,it})=>{ const s=room(slug); s.todos=s.todos.filter(x=>x.id!==it.id) }); save(); render() }}))));
  }
  if(!list.length){
    const filtered = FILTER.q || FILTER.cat!=="all";
    const msg = filtered ? "No to-dos match this search." :
      {today:`Nothing planned for day ${P.currentDay}. Add one in a room with the Day + button.`,
       always:"No to-dos that always apply.", past:"No leftovers from earlier days."}[tab];
    sec.append(el("p",{class:"muted",text: !filtered && source.length && P.hideDone ? "Everything here is done." : msg}));
  } else sec.append(groupedList(list, render, {hideDay:tab==="today"}));
  panel.append(sec);
  view.append(panel);
}

// ---------- Rooms page ----------
function visitedRooms(){
  return ROOMS.filter(r=>data.rooms[r.slug] && data.rooms[r.slug].visitedAt).sort((a,b)=>data.rooms[b.slug].visitedAt-data.rooms[a.slug].visitedAt);
}
function roomList(rooms){
  const ul = el("ul",{class:"rlist"});
  rooms.forEach(r=>{
    const s = room(r.slug), open = s.todos.filter(t=>!t.done).length;
    ul.append(el("li",{},el("a",{class:"rrow",href:"#"+r.slug,style:roomVars(r)},
      el("span",{class:"mini",html:planSvg(r,26)}),
      el("span",{class:"nm"},r.name, s.upgrade ? el("small",{class:"upg-line",text:s.upgrade.text?`Upgraded: ${s.upgrade.text}`:"Upgraded"}) : null),
      el("span",{class:"no",text:r.n?`№ ${pad(r.n)}`:r.cat==="outer"?"Outer":CAT[r.cat].label}),
      el("span",{class:"open"+(open?"":" zero"),title:"Open to-dos",text:open?String(open):"–"}))));
  });
  return ul;
}
function renderRooms(){
  view.replaceChildren();
  const everything = visitedRooms();
  const type = TYPES.some(([k])=>k===P.listType) ? P.listType : "house";
  const all = everything.filter(r=>typeOf(r)===type);
  view.append(el("div",{class:"page-h"},el("a",{class:"btn ghost",href:"#",text:"← Home"}),el("h2",{text:"Your notebook"}),el("span",{class:"count",text:String(everything.length)})));
  view.append(typeTabs(type, k=>{ P.listType=k; FILTER.cat="all"; FILTER.q=""; save(); render() }, everything));
  if(!all.length){ view.append(el("div",{class:"empty",text:EMPTY_TYPE[type]})); return }
  const sorts = [["recent","Recent"],["name","A–Z"],["open","Open to-dos"]];
  const sort = sorts.some(([k])=>k===P.roomSort) ? P.roomSort : "recent";
  const seg = el("span",{class:"seg",role:"radiogroup","aria-label":"Sort"});
  sorts.forEach(([k,l])=>seg.append(el("button",{type:"button",role:"radio","aria-checked":String(sort===k),text:l,onclick:()=>{ P.roomSort=k; save(); render() }})));
  view.append(el("div",{class:"toolbar"},filterBar("Search this list",new Set(type==="house"||type==="grounds"?all.map(r=>r.cat):[])),el("div",{class:"tools end"},el("span",{class:"label",text:"Sort"}),seg)));
  let list = all.filter(r=>matches(r,""));
  if(sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
  if(sort==="open") list.sort((a,b)=>room(b.slug).todos.filter(t=>!t.done).length-room(a.slug).todos.filter(t=>!t.done).length);
  view.append(list.length ? roomList(list) : el("p",{class:"muted",text:"Nothing matches this search."}));
}


// ---------- Upgrades ----------
function upgradeBar(r, s){
  const edit = async () => {
    const res = await openModal(done=>{
      const inp = el("input",{type:"text",value:s.upgrade?s.upgrade.text||"":"",placeholder:"e.g. new name or what changed","aria-label":"Upgrade description","data-autofocus":true,class:"modal-input"});
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); done({text:inp.value.trim()}) } });
      return [el("h3",{text:s.upgrade?"Edit upgrade":"Mark as upgraded"}),
        el("p",{text:"Optional: describe the upgrade with its new name or a short note. Leave it empty to just mark the room as upgraded."}),
        inp,
        el("div",{class:"acts"},
          el("button",{class:"btn",type:"button",text:"Cancel",onclick:()=>done(null)}),
          el("button",{class:"btn primary",type:"button",text:"Save",onclick:()=>done({text:inp.value.trim()})}))];
    });
    if(!res) return;
    s.upgrade = {text:res.text, day: s.upgrade&&s.upgrade.day ? s.upgrade.day : (P.currentDay||null), at: Date.now()};
    save(); render();
  };
  if(!s.upgrade) return el("div",{class:"upg-bar"},el("button",{class:"btn ghost sm",type:"button",text:"Mark as upgraded",onclick:edit}));
  return el("div",{class:"upg-bar on"},
    el("span",{class:"upg-tx"},el("span",{class:"label",text:"Upgrade"}),
      el("span",{text:(s.upgrade.text||"Upgraded")+(s.upgrade.day?` · day ${s.upgrade.day}`:"")})),
    el("span",{class:"tools"},
      el("button",{class:"btn ghost sm",type:"button",text:"Edit",onclick:edit}),
      el("button",{class:"btn ghost sm danger",type:"button",text:"Remove",onclick:async()=>{
        if(!await confirmBox({title:"Remove upgrade?",body:`${r.name} will no longer be marked as upgraded.`,ok:"Remove",danger:true})) return;
        delete s.upgrade; save(); render(); }})));
}

// ---------- Room ----------
function listSec(r, key, title, empty, placeholder){
  const s = room(r.slug), isTodo = key==="todos";
  const rerender = () => render();
  const sec = el("div",{class:"sec"});
  const doneN = isTodo ? s.todos.filter(t=>t.done).length : 0;
  sec.append(el("div",{class:"sec-h"},el("h3",{text:title}),
    el("div",{class:"tools"},
      s[key].length ? el("span",{class:"count",text:isTodo?`${doneN}/${s[key].length}`:String(s[key].length)}) : null,
      isTodo ? hideToggle(doneN,rerender) : null)));
  let list = isTodo ? sortTodos(s[key]) : [...s[key]];
  if(isTodo && P.hideDone) list = list.filter(t=>!t.done);
  if(!s[key].length) sec.append(el("p",{class:"muted",text:empty}));
  else if(!list.length) sec.append(el("p",{class:"muted",text:"Everything is done."}));
  if(list.length){
    const ul = el("ul",{class:"list"});
    list.forEach(it=>ul.append(itemRow(r.slug,key,it,{onChange:rerender})));
    sec.append(ul);
  }
  sec.append(addRow(r.slug,key,placeholder,rerender));
  return sec;
}

function notesSec(r){
  const s = room(r.slug);
  const sec = el("div",{class:"sec"});
  sec.append(el("div",{class:"sec-h"},el("h3",{text:"Notes"}),s.notes.length?el("span",{class:"count",text:String(s.notes.length)}):null));
  if(!s.notes.length) sec.append(el("p",{class:"muted",text:"No notes yet. Each note gets a day stamp so you know when you wrote it."}));
  else {
    const ul = el("ul",{class:"list"});
    [...s.notes].sort((a,b)=>(b.day||0)-(a.day||0)||b.created-a.created).forEach(n=>{
      const li = el("li",{class:"item",style:roomVars(r)});
      if(editing === `${r.slug}|notes|${n.id}`){
        const ta = el("textarea",{"aria-label":"Note","data-edit":"1"}); ta.value = n.text;
        const dayIn = el("input",{type:"number",inputmode:"numeric",min:"1",value:String(n.day||P.currentDay||maxDay()),"aria-label":"Day"});
        const step = d => dayIn.value = String(Math.max(1,(parseInt(dayIn.value,10)||1)+d));
        const close = () => { editing=null; render() };
        const f = el("form",{class:"edit",onsubmit:e=>{ e.preventDefault(); const t=ta.value.trim(); if(!t){ta.focus();return}
            n.text=t; n.day=Math.max(1,parseInt(dayIn.value,10)||1); n.edited=Date.now(); save(); close() }},
          ta,
          el("div",{class:"row"},el("span",{class:"label",text:"Day"}),el("span",{class:"stepper"},
            el("button",{class:"btn",type:"button","aria-label":"Day down",text:"−",onclick:()=>step(-1)}),dayIn,
            el("button",{class:"btn",type:"button","aria-label":"Day up",text:"+",onclick:()=>step(1)}))),
          el("div",{class:"acts"},
            el("button",{class:"btn ghost danger",type:"button",text:"Delete",onclick:()=>{ s.notes=s.notes.filter(x=>x.id!==n.id); save(); close() }}),
            el("div",{},el("button",{class:"btn",type:"button",text:"Cancel",onclick:close}),el("button",{class:"btn primary",type:"submit",text:"Save"}))));
        f.addEventListener("keydown",e=>{ if(e.key==="Escape"){ e.stopPropagation(); close() } });
        li.append(f);
      } else {
        li.append(el("span",{class:"dot","aria-hidden":"true"}),
          el("button",{class:"body",type:"button","aria-label":"Edit note",onclick:()=>{ editing=`${r.slug}|notes|${n.id}`; render() }},
            el("span",{class:"meta"},el("span",{class:"chip day",text:n.day?`Day ${n.day}`:"No day"}),
              el("span",{class:"note-stamp",text:fmtDate(n.created)+(n.edited?" · edited":"")})),
            el("span",{class:"t",text:n.text})));
      }
      ul.append(li);
    });
    sec.append(ul);
  }
  const ta = el("textarea",{id:"add-note",placeholder:"Codes, hunches, what you saw…","aria-label":"New note"});
  sec.append(el("div",{class:"add-note"},ta,el("div",{class:"btns"},
    el("button",{class:"btn room",type:"button",text:P.currentDay?`Add note · Day ${P.currentDay}`:"Add note",onclick:async()=>{
      const t = ta.value.trim(); if(!t){ ta.focus(); return }
      const day = await ensureDay(); if(!day) return;
      s.notes.push({id:uid(),text:t,day,created:Date.now()}); save(); render();
    }}))));
  return sec;
}

function renderRoom(r){
  const s = room(r.slug);
  if(!s.visitedAt){ s.visitedAt = Date.now(); save() }
  const c = CAT[r.cat], isRoom = typeOf(r)==="house" || r.cat==="outer";
  const noun = isRoom ? "room" : "page";
  view.replaceChildren();
  const wrap = el("div",{style:roomVars(r)+";display:flex;flex-direction:column;gap:16px"});
  wrap.append(el("div",{class:"backrow"},el("a",{class:"btn ghost",href:"#",text:"← Home"})));
  const sn = secretNotice(r, s);
  if(sn) wrap.append(sn.el);
  if(sn && sn.gate){
    wrap.append(el("div",{class:"foot"},el("a",{class:"btn ghost",href:"#",text:"Not now, back home"})));
    view.append(wrap); return;
  }

  const card = el("article",{class:"panel"},
    el("div",{class:"card-head"+(r.slug==="aquarium"?" aq":"")},
      el("div",{class:"row"},el("span",{class:"kind",text:r.slug==="aquarium"?"Blueprint · every colour":c.label}),
        el("span",{class:"num",text:r.n?`№ ${pad(r.n)}`:r.cat==="outer"?"Outside the house":""})),
      el("h2",{text:r.name}), el("span",{class:"plan",html:planSvg(r)}),
      s.upgrade ? el("span",{class:"upg-badge",text:s.upgrade.text?`Upgraded: ${s.upgrade.text}`:"Upgraded"}) : null),
    isRoom ? upgradeBar(r, s) : null,
    listSec(r,"todos","To-dos","Nothing on the list yet. Add what you still need to do or remember here.","New to-do"),
    listSec(r,"found","Found","Nothing found yet. Add items, codes or clues you found here.","What did you find?"),
    notesSec(r));
  wrap.append(card);

  const hint = el("section",{class:"panel"});
  const hs = el("div",{class:"sec hint"});
  if(!r.hint){
    // General pages have no hint
  } else if(s.hintOpen){
    hs.append(el("div",{class:"sec-h"},el("h3",{text:"Hint"}),el("span",{class:"label",text:"Opened"})),
      el("p",{class:"text",text:r.hint}),
      HINT2[r.name] ? (s.hint2Open
        ? el("div",{class:"hint2"},el("span",{class:"label",text:"Deeper hint"}),el("p",{class:"text",text:HINT2[r.name]}))
        : el("button",{class:"btn",type:"button",text:"Show a deeper hint",onclick:async()=>{
            if(!await confirmBox({title:"Show a deeper hint?",body:"This hint is more specific and may give away most of the solution. Once opened, it stays visible.",ok:"Show deeper hint"})) return;
            s.hint2Open = true; save(); render();
          }})) : null,
      el("p",{class:"src"},"Based on the community wiki; may be incomplete. ",el("a",{href:wikiUrl(r),target:"_blank",rel:"noopener",text:`${r.name} on the wiki ›`})));
  } else {
    hs.append(el("div",{class:"seal"},el("span",{class:"lock","aria-hidden":"true",html:LOCK}),
      el("p",{text:`The hint for this ${noun} is sealed. Open it only when you are stuck.`})),
      el("button",{class:"btn room",type:"button",text:"Show hint",onclick:async()=>{
        if(!await confirmBox({title:"Show the hint?",body:`A hint may give away part of a puzzle. Once opened, it stays visible for this ${noun}.`,ok:"Show hint"})) return;
        s.hintOpen = true; save(); render();
      }}));
  }
  hint.append(hs);
  if(r.hint) wrap.append(hint);

  wrap.append(el("div",{class:"foot"},el("button",{class:"btn ghost danger",type:"button",text:`Delete ${noun}`,onclick:async()=>{
    const custom = r.cat==="general";
    if(!await confirmBox({title:`Delete ${r.name}?`,body:custom?"This removes this page with all its to-dos, finds and notes. This cannot be undone.":`This removes all to-dos, finds and notes for this ${noun} and seals the hint again. This cannot be undone.`,ok:`Delete ${noun}`,danger:true})) return;
    delete data.rooms[r.slug];
    if(custom){ delete data.custom[r.slug]; delete BY_SLUG[r.slug]; delete BY_NORM[norm(r.name)]; ROOMS.splice(ROOMS.indexOf(r),1) }
    save(); location.hash = "";
  }})));
  view.append(wrap);
}

// ---------- Routing ----------
const pageOf = h => TODO_TABS.some(([,x])=>x===h) ? "todos" : h==="rooms" ? "rooms" : "other";
let lastPage = pageOf(decodeURIComponent(location.hash.slice(1)));
function render(){
  renderDay();
  const h = decodeURIComponent(location.hash.slice(1));
  const y = window.scrollY;
  const t = TODO_TABS.find(([,x])=>x===h);
  if(t) renderTodos(t[0]); else if(h==="rooms") renderRooms(); else if(BY_SLUG[h]) renderRoom(BY_SLUG[h]); else renderHome();
  window.scrollTo(0,y);
  const ed = view.querySelector("[data-edit]");
  if(ed){ ed.focus(); if(ed.select) ed.select() }
}
window.addEventListener("hashchange",()=>{
  editing=null;
  const p = pageOf(decodeURIComponent(location.hash.slice(1)));
  if(p!==lastPage){ FILTER.q=""; FILTER.cat="all" }
  lastPage = p;
  render(); window.scrollTo(0,0);
});
window.addEventListener("storage",e=>{ if(e.key===KEY) location.reload() });
render();
</script>
